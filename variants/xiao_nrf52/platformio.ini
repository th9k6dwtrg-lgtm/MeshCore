lib_deps =
  ${Xiao_nrf52.lib_deps}

; ---------------------------------------------------------------------------
; Zahrada: repeater bez I2C (D6 = rizeni MOSFETu) a s ceskym radiovym nastavenim
; Jen pro test radia pred vlastnim firmwarem svetla.
[env:Xiao_nrf52_repeater_zahrada]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D XIAO_NO_I2C
  -D LORA_FREQ=869.432
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ADVERT_NAME='"zahrada-test"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

; ---------------------------------------------------------------------------
; Zahrada: firmware zahradniho svetla (MeshCore Sensor + prikazy LON/LOFF/STATUS, kanal, watchdog, upozorneni)
; D6 -> MOSFET LR7843, bez I2C, ceske radiove nastaveni.
; Admin heslo NEZADAVAT sem (repozitar je verejny) - nastavuje se po flashi prikazem 'password'.
[env:Xiao_nrf52_light]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -I examples/simple_sensor
  -D XIAO_NO_I2C
  -D PIN_BOARD_LIGHT=D6
  -D LORA_FREQ=869.432
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ADVERT_NAME='"zahrada-svetlo"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_sensor/*.cpp>
  -<../examples/simple_sensor/main.cpp>
  +<../examples/zahrada_light/*.cpp>

; ---------------------------------------------------------------------------
; Radar: hlidaci cidlo s HLK-LD2410S (OT2 -> D7), svetlo / testovaci LED na D6, viz examples/radar_alarm.
; UART radaru pro RADAR KALIBRACE / RADAR PRAHY na NFC padech (NFC1 = P0.09 <- OT1, NFC2 = P0.10 -> RX radaru).
; Admin heslo NEZADAVAT sem (repozitar je verejny) - nastavuje se po flashi prikazem 'password'.
[env:Xiao_nrf52_radar]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -I examples/simple_sensor
  -D XIAO_NO_I2C
  -D PIN_BOARD_LIGHT=D6
  -D PIN_RADAR_OUT=D7
  -D CONFIG_NFCT_PINS_AS_GPIOS
  -D PIN_RADAR_UART_RX=PIN_NFC1
  -D PIN_RADAR_UART_TX=PIN_NFC2
  -D LORA_FREQ=869.432
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D ADVERT_NAME='"dum-radar"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_sensor/*.cpp>
  -<../examples/simple_sensor/main.cpp>
  +<../examples/radar_alarm/*.cpp>
