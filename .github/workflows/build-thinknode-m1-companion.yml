name: Build ThinkNode M1 Companion (CZ repeat)

on:
  workflow_dispatch:
  push:
    branches:
      - m1-cz-repeat

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: v1.17.1-czrepeat
        run: /usr/bin/env bash build.sh build-firmware ThinkNode_M1_companion_radio_ble

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          name: ThinkNode_M1_companion_radio_ble-czrepeat
          path: out

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: m1-companion-v1.17.1-czrepeat-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "ThinkNode M1 Companion v1.17.1 + CZ repeat (build ${{ github.run_number }})"
          body: "Companion firmware v1.17.1 for ThinkNode M1 (BLE). Client repeat is also allowed on the Czech Republic (Narrow) preset 869.432 MHz."
          prerelease: true
          make_latest: false
          files: out/*
